<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1600" width="2400" height="1600">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10192c"/>
      <stop offset="38%" stop-color="#162640"/>
      <stop offset="68%" stop-color="#17352f"/>
      <stop offset="100%" stop-color="#23451f"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="12%" r="58%">
      <stop offset="0%" stop-color="#f4f8ff" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#b8cbde" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#b8cbde" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="blur34"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="blur70"><feGaussianBlur stdDeviation="70"/></filter>
    <linearGradient id="pitchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4e8b3f"/>
      <stop offset="52%" stop-color="#35672d"/>
      <stop offset="100%" stop-color="#264d22"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5de" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fff5de" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lightOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9e7" stop-opacity="0.92"/>
      <stop offset="45%" stop-color="#ffe8b7" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#ffe8b7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stripeA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.00"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="48%" r="80%">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.50"/>
    </radialGradient>
  </defs>

  <rect width="2400" height="1600" fill="url(#skyGrad)"/>
  <rect width="2400" height="1600" fill="url(#centerGlow)"/>

  <!-- distant blurred stands/ambience -->
  <ellipse cx="1200" cy="500" rx="1080" ry="220" fill="#9fb5ca" opacity="0.08" filter="url(#blur70)"/>
  <ellipse cx="1200" cy="620" rx="980" ry="120" fill="#ffd6a6" opacity="0.06" filter="url(#blur70)"/>

  <!-- floodlights -->
  <g filter="url(#blur20)">
    <circle cx="260" cy="150" r="56" fill="url(#lightOrb)"/>
    <circle cx="390" cy="205" r="48" fill="url(#lightOrb)"/>
    <circle cx="535" cy="255" r="42" fill="url(#lightOrb)"/>
    <circle cx="1845" cy="122" r="58" fill="url(#lightOrb)"/>
    <circle cx="1988" cy="176" r="48" fill="url(#lightOrb)"/>
    <circle cx="2136" cy="228" r="42" fill="url(#lightOrb)"/>
  </g>

  <!-- soft central haze -->
  <ellipse cx="1200" cy="210" rx="560" ry="110" fill="#ffffff" opacity="0.05" filter="url(#blur34)"/>

  <!-- pitch -->
  <g>
    <rect x="0" y="1125" width="2400" height="475" fill="url(#pitchGrad)"/>
    <ellipse cx="1200" cy="1138" rx="1140" ry="78" fill="url(#horizonGlow)" filter="url(#blur34)"/>

    <!-- mowing stripes -->
    <rect x="0" y="1125" width="2400" height="475" fill="url(#stripeA)"/>
    <rect x="180" y="1125" width="2400" height="475" fill="url(#stripeA)" opacity="0.7"/>
    <rect x="360" y="1125" width="2400" height="475" fill="url(#stripeA)" opacity="0.55"/>
    <rect x="540" y="1125" width="2400" height="475" fill="url(#stripeA)" opacity="0.45"/>
    <rect x="720" y="1125" width="2400" height="475" fill="url(#stripeA)" opacity="0.35"/>

    <!-- subtle field markings -->
    <g opacity="0.12">
      <rect x="880" y="1255" width="640" height="4" fill="#ffffff"/>
      <circle cx="1200" cy="1257" r="92" fill="none" stroke="#ffffff" stroke-width="4"/>
    </g>
  </g>

  <rect width="2400" height="1600" fill="url(#vignette)"/>
</svg>
